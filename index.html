<!DOCTYPE html>
<html>
<head>
  <title>Shoe Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="logo">Shoe<span>Shop</span></div>

  <nav>
    <a href="index.html">Shop</a>
    <a href="cart.html">Cart 🛒 <span id="cartCount">0</span></a>
  </nav>

  <div id="authArea"></div>
</header>

<section class="hero">
  <h1>Step Into Style</h1>
  <p>Premium shoes for comfort, fashion and sports.</p>
</section>

<section class="section">
  <h2>Latest Shoes</h2>
  <div id="productsContainer" class="product-grid"></div>
</section>

<div id="loginPopup" class="popup">
  <div class="popup-box">
    <span onclick="closeLoginPopup()" class="close">&times;</span>
    <h2>Login / Register</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="register()" class="yellow">Register</button>
  </div>
</div>

<script type="module" src="auth.js"></script>
<script type="module" src="shop.js"></script>

</body>
</html>
