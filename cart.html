<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cart | Shoe Culture</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Navbar -->
<header class="customer-header">

  <a href="index.html" class="customer-logo">
    SHOE<span>CULTURE</span>
  </a>

  <button
    id="mobileMenuButton"
    class="mobile-menu-button"
    type="button"
    aria-label="Open navigation menu"
  >
    ☰
  </button>

<nav id="customerNavigation" class="customer-navigation">
    <a href="index.html">Home</a>
    <a href="menu.html">Shop</a>
    <a href="index.html#about">About</a>
    <a href="index.html#location">Location</a>

    <a href="index.html#contact">Contact</a>
    <a href="orders.html">My Orders</a>

    <a
      href="cart.html" class="cart-navigation-link">
      Cart
      <span id="cartCount" class="cart-count">0</span>
    </a>
    <div id="authArea"></div>
  </nav>

</header>

  <!-- Cart page -->
  <main>

    <section class="cart-page-section">

      <div class="cart-page-heading">

        <div>
          <p class="section-label">
            YOUR SHOPPING BAG
          </p>

          <h1>Your Cart</h1>
        </div>

        <a
          href="menu.html"
          class="continue-shopping-link"
        >
          ← Continue Shopping
        </a>

      </div>

      <div class="cart-page-layout">

        <!-- Cart items -->
        <div class="cart-products-panel">

          <div id="cartItems">
            <!-- Products appear here -->
          </div>

        </div>

        <!-- Order summary -->
        <aside class="cart-summary">

          <h2>Order Summary</h2>

          <div class="summary-row">
            <span>Items</span>

            <span id="summaryItemCount">
              0 items
            </span>
          </div>

          <div class="summary-row">
            <span>Subtotal</span>

            <span>
              £<span id="subtotal">0.00</span>
            </span>
          </div>

          <div class="summary-row">
            <span>Delivery</span>
            <span>Free</span>
          </div>

          <div class="summary-row summary-total">
            <span>Total</span>

            <strong>
              £<span id="total">0.00</span>
            </strong>
          </div>

          <button
            id="placeOrderButton"
            type="button"
            class="checkout-btn"
          >
            Place Order
          </button>

          <p class="checkout-note">
            Login or register before placing your order.
          </p>

        </aside>

      </div>

    </section>

  </main>

  <!-- Login/Register popup -->
  <div
    id="loginPopup"
    class="popup"
  >

    <div class="popup-box">

      <button
        type="button"
        class="close"
        onclick="closeLoginPopup()"
        aria-label="Close popup"
      >
        &times;
      </button>

      <div class="auth-tabs">

        <button
          id="loginTabButton"
          type="button"
          class="auth-tab active"
          onclick="setAuthMode('login')"
        >
          Login
        </button>

        <button
          id="registerTabButton"
          type="button"
          class="auth-tab"
          onclick="setAuthMode('register')"
        >
          Register
        </button>

      </div>

      <h2 id="authPopupTitle">
        Welcome Back
      </h2>

      <p id="authPopupDescription">
        Login or register before placing your order.
      </p>

      <label for="email">
        Email address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Minimum 6 characters"
        autocomplete="current-password"
      >

      <p
        id="authMessage"
        class="auth-message"
      ></p>

      <button
        id="loginSubmitButton"
        type="button"
        class="auth-submit-button"
        onclick="login()"
      >
        Login
      </button>

      <button
        id="registerSubmitButton"
        type="button"
        class="auth-submit-button register-submit-button"
        onclick="register()"
        style="display: none;"
      >
        Create Account
      </button>

    </div>

  </div>

  <!-- Cart notification -->
  <div
    id="cartNotification"
    class="cart-notification"
  ></div>

  <!-- Load auth first -->
  <script
    type="module"
    src="auth.js"
  ></script>

  <script
    type="module"
    src="cart.js"
  ></script>

</body>
</html>
