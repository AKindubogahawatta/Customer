<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cart | Shoe Shop</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Navigation -->
  <header class="navbar">

    <a href="index.html" class="logo">
      Shoe<span>Shop</span>
    </a>

    <button
      id="mobileMenuButton"
      class="mobile-menu-button"
      type="button"
      aria-label="Open navigation menu"
    >
      ☰
    </button>

    <nav id="customerNavigation">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="orders.html">My Orders</a>

      <a href="cart.html" class="active">
        Cart 🛒
        <span id="cartCount">0</span>
      </a>
    </nav>

    <div id="authArea"></div>

  </header>

  <!-- Cart section -->
  <main>

    <section class="cart-page-section">

      <div class="cart-page-heading">
        <div>
          <p class="section-label">YOUR SHOPPING BAG</p>
          <h1>Your Cart</h1>
        </div>

        <a href="menu.html" class="continue-shopping-link">
          ← Continue Shopping
        </a>
      </div>

      <div class="cart-page-layout">

        <!-- Cart products -->
        <div class="cart-products-panel">

          <div id="cartItems">
            <!-- Cart products appear here -->
          </div>

        </div>

        <!-- Cart summary -->
        <aside class="cart-summary">

          <h2>Order Summary</h2>

          <div class="summary-row">
            <span>Items</span>
            <span id="summaryItemCount">0</span>
          </div>

          <div class="summary-row">
            <span>Subtotal</span>
            <span>
              £<span id="subtotal">0.00</span>
            </span>
          </div>

          <div class="summary-row">
            <span>Delivery</span>
            <span>Free</span>
          </div>

          <div class="summary-row summary-total">
            <span>Total</span>

            <strong>
              £<span id="total">0.00</span>
            </strong>
          </div>

          <button
            id="placeOrderButton"
            type="button"
            class="checkout-btn"
          >
            Place Order
          </button>

          <p class="checkout-note">
            You must be logged in before placing an order.
          </p>

        </aside>

      </div>

    </section>

  </main>

  <!-- Login popup -->
  <div id="loginPopup" class="popup">

    <div class="popup-box">

      <button
        type="button"
        onclick="closeLoginPopup()"
        class="close"
        aria-label="Close login popup"
      >
        &times;
      </button>

      <h2>Login or Register</h2>

      <p>
        Please log in before placing your order.
      </p>

      <label for="email">Email address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
      >

      <button
        type="button"
        onclick="login()"
      >
        Login
      </button>

      <button
        type="button"
        onclick="register()"
        class="yellow"
      >
        Register
      </button>

    </div>

  </div>

  <!-- Notification -->
  <div id="cartNotification" class="cart-notification"></div>

  <script type="module" src="auth.js"></script>
  <script type="module" src="cart.js"></script>

</body>
</html>
